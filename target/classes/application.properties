spring.application.name=portal-backend
server.port=${PORT:8080}

# Database Configuration
# Default uses PostgreSQL if configured, or H2 in-memory for zero-setup local dev/testing
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:nodewavedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Security Configuration
jwt.secret=${JWT_SECRET:nodewave-super-secret-key-2026-very-secure-must-be-long-enough-32bytes}
jwt.expiration-ms=86400000

# H2 Console (available at /h2-console when using H2)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
